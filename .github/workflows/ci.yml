name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pinned here on purpose: package.json's "packageManager"
        # field is the single source of truth, and pnpm/action-setup reads it.
        # Pinning in both places lets them drift apart silently.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches the NODE_VERSION build variable in Cloudflare Workers
          # Builds, which deploys what this job validated. package.json's
          # "engines" allows >=24, so a newer local Node is fine; the shipped
          # artifact is built on this one.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The real production build. `next build` alone can pass while the
      # OpenNext adapter fails, and `main` auto-deploys to Cloudflare — so a
      # Worker-specific break would otherwise reach production undetected.
      # Must stay AFTER Lint: this writes .open-next/, and the flat ESLint
      # config does not read .gitignore, so linting afterwards would walk it.
      - name: Build Worker (OpenNext)
        run: pnpm exec opennextjs-cloudflare build
