name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pinned here on purpose: package.json's "packageManager"
        # field is the single source of truth, and pnpm/action-setup reads it.
        # Pinning in both places lets them drift apart silently.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches the NODE_VERSION build variable in Cloudflare Workers
          # Builds, which deploys what this job validated. package.json's
          # "engines" allows >=24, so a newer local Node is fine; the shipped
          # artifact is built on this one.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Browser-level gate on the production build (`next start` of the
      # artifact above): intro gate, world map, garage WebGL, café terminal,
      # career, résumé, lobby contact plates, security headers. Chromium only;
      # its bundled SwiftShader is what makes the R3F scenes render headless.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The real production build. `next build` alone can pass while the
      # OpenNext adapter fails, and `main` auto-deploys to Cloudflare — so a
      # Worker-specific break would otherwise reach production undetected.
      # Must stay AFTER Lint: this writes .open-next/, and the flat ESLint
      # config does not read .gitignore, so linting afterwards would walk it.
      - name: Build Worker (OpenNext)
        run: pnpm exec opennextjs-cloudflare build
